name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run biome check
        run: pnpm ci:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify generated types
        id: verify-generated
        run: |
          git add --intent-to-add --all -- src
          git diff --output="$RUNNER_TEMP/generated.diff" --exit-code -- src

      - name: Comment generated types diff
        if: >-
          failure() &&
          steps.verify-generated.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "**Verify generated types** failed: \`src/\` does not match the output of \`pnpm generate\`."
            echo "Run \`pnpm generate\` and commit the result."
            echo
            echo "<details><summary>Diff</summary>"
            echo
            echo "~~~~diff"
            # Stay well below GitHub's 65536-character comment limit
            head -c 55000 "$RUNNER_TEMP/generated.diff"
            echo
            echo "~~~~"
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none
