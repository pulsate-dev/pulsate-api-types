name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          npm_version=$(node -p 'require("./package.json").version')
          jsr_version=$(node -p 'require("./jsr.json").version')
          test "${GITHUB_REF_NAME}" = "v${npm_version}"
          test "${npm_version}" = "${jsr_version}"

      - name: Generate types
        run: pnpm generate

      - name: Verify generated types
        run: git diff --exit-code -- src

      - name: Build npm package
        run: pnpm build

      - name: Publish to JSR
        run: npx --yes jsr@0.14.3 publish

      - name: Publish to npm
        run: |
          npm config set registry https://registry.npmjs.org
          npm publish --access public --provenance
