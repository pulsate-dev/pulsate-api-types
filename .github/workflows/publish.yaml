name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        run: |
          version=$(deno eval 'const { version } = JSON.parse(await Deno.readTextFile("deno.json")); console.log(version)')
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Generate types
        run: deno task build

      - name: Verify generated types
        run: git diff --exit-code -- src

      - name: Publish to JSR
        run: deno publish

      - name: Build npm package
        run: deno task build-npm

      - name: Publish to npm
        run: npm publish ./npm --access public --provenance
