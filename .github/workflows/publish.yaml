name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          npm_version=$(cat ./package.json | jq -r .version)
          jsr_version=$(cat ./jsr.json | jq -r .version)
          test "${GITHUB_REF_NAME}" = "v${npm_version}"
          test "${npm_version}" = "${jsr_version}"

      - name: Generate types
        run: pnpm generate

      - name: Verify generated types
        run: test -z "$(git status --porcelain -- src)"

      - name: Build npm package
        run: pnpm build

      - name: Publish to JSR
        run: npx --yes jsr@0.14.3 publish

      - name: Publish to npm
        run: |
          npm config set registry https://registry.npmjs.org
          npm publish --access public --provenance
